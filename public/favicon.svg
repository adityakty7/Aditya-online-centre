<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Aditya Online Center">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#161822" />
      <stop offset="100%" stopColor="#101014" />
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#F8FAFC" />
      <stop offset="48%" stopColor="#CBD5E1" />
      <stop offset="100%" stopColor="#64748B" />
    </linearGradient>
    <linearGradient id="emberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFB547" />
      <stop offset="50%" stopColor="#FF5C35" />
      <stop offset="100%" stopColor="#C83713" />
    </linearGradient>
    <linearGradient id="swooshGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stopColor="#94A3B8" />
      <stop offset="45%" stopColor="#FF5C35" />
      <stop offset="100%" stopColor="#FFB547" />
    </linearGradient>
  </defs>

  <!-- Charcoal Black Rounded Square App Badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#FF5C35" strokeOpacity="0.45" strokeWidth="1.5" />

  <!-- Subtle Ember Ambient Glow -->
  <circle cx="32" cy="30" r="20" fill="#FF5C35" fillOpacity="0.14" />

  <!-- Digital Pixel Cubes (Top-Right Tech Accent from Official Logo) -->
  <rect x="44" y="10" width="4.5" height="4.5" rx="0.8" fill="#FF5C35" />
  <rect x="50" y="13" width="3.5" height="3.5" rx="0.6" fill="#FFB547" />
  <rect x="47" y="16.5" width="3" height="3" rx="0.6" fill="#CBD5E1" />
  <rect x="12" y="15" width="3.5" height="3.5" rx="0.6" fill="#CBD5E1" fillOpacity="0.85" />

  <!-- 3D Metallic Silver Left Pillar of 'A' -->
  <path d="M31.5 11L14.5 50H23.5L32.5 27.5L31.5 11Z" fill="url(#silverGrad)" />

  <!-- 3D Fiery Ember Orange Right Pillar of 'A' -->
  <path d="M31.5 11L32.5 27.5L40.5 50H49.5L31.5 11Z" fill="url(#emberGrad)" />

  <!-- Inner Apex Star Highlight -->
  <polygon points="32,20 35.5,29 28.5,29" fill="#FFFDF9" fillOpacity="0.9" />

  <!-- Futuristic Orbital Ring / Swoosh Wrapping the 'A' -->
  <path
    d="M9 39C15 44.5 29 45.5 44 37.5C51 33.8 55.5 29 56.5 25.5C54 30.5 46.5 36.2 33.5 39.2C21.5 42 13 40.8 9 39Z"
    fill="url(#swooshGrad)"
  />
</svg>
